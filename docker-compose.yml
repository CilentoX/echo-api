# Echo API — Docker Compose (Coolify Production)
# Deploys Fastify + Prisma API conectando no PostgreSQL do Synapse via rede coolify.
#
# Variáveis de ambiente obrigatórias (definir no Coolify):
#   ECHO_API_DB_PASSWORD      — Senha do PostgreSQL (mesma do Synapse)
#   ECHO_API_API_KEY          — Chave de API para autenticar requisições
#
# Redes:
#   coolify                   — Rede compartilhada com Synapse, Postgres e Traefik (externa)

services:
  echo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echo-api
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      # Conecta no PostgreSQL do Synapse via rede coolify (database 'synapse')
      DATABASE_URL: postgresql://synapse:${ECHO_API_DB_PASSWORD?ECHO_API_DB_PASSWORD is required}@echo-postgres:5432/synapse?schema=public
      API_KEY: ${ECHO_API_API_KEY?ECHO_API_API_KEY is required}
      UPLOAD_DIR: /app/src/uploads
      MAX_FILE_SIZE: 10485760
      PUBLIC_BASE_URL: https://api.echo.litteris.online
    networks:
      - coolify
    volumes:
      - echo_api_uploads:/app/src/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.echo-api.rule=Host(`api.echo.litteris.online`)"
      - "traefik.http.routers.echo-api.entryPoints=http"
      - "traefik.http.services.echo-api.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.echo-api-proto.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.echo-api.middlewares=echo-api-proto@docker"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  echo_api_uploads:

networks:
  coolify:
    external: true